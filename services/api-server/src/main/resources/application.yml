spring:
  application:
    name: warehouse-api-server
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ops
    username: warehouse
    password: warehouse
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

