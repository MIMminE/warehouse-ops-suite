name: CI Admin Web

on:
  pull_request:
    paths:
      - "apps/admin-web/**"
      - "packages/shared-contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "eslint.config.mjs"
  push:
    branches:
      - main
    paths:
      - "apps/admin-web/**"
      - "packages/shared-contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "eslint.config.mjs"

jobs:
  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @warehouse/admin-web lint

      - run: pnpm --filter @warehouse/admin-web build

